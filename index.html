<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinControl Pro — Alef</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f4f9;
      --surface: #ffffff;
      --card: #ffffff;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent2: #0891b2;
      --accent3: #ef4444;
      --accent4: #7c3aed;
      --text: #0f172a;
      --muted: #64748b;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --personal: #2563eb;
      --family: #ea580c;
      --agency: #7c3aed;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* LAYOUT */
    .app { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }

    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }

    .nav-section-label {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 12px 12px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: var(--card); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #ffffff; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-icon { font-size: 16px; flex-shrink: 0; }

    .nav-badge {
      margin-left: auto;
      background: var(--accent3);
      color: white;
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    .month-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f4f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .month-selector select {
      background: none;
      border: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      flex: 1;
    }
    .month-selector select option { background: #ffffff; }

    /* MAIN */
    .main { margin-left: 240px; flex: 1; }

    /* TOPBAR */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(241,244,249,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
    }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-primary { background: var(--accent); color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--card); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #ef4444; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* PAGE */
    .page { padding: 32px; max-width: 1200px; }

    /* CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .stat-card.yellow::before { background: var(--accent); }
    .stat-card.green::before { background: var(--success); }
    .stat-card.orange::before { background: var(--family); }
    .stat-card.purple::before { background: var(--agency); }
    .stat-card.blue::before { background: var(--personal); }
    .stat-card.red::before { background: var(--danger); }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'DM Mono', monospace;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin-top: 6px;
      line-height: 1;
    }
    .stat-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* TABLE */
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .section-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 12px 20px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 20px;
      font-size: 13px;
      border-bottom: 1px solid #f1f5f9;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .amount-pos { color: var(--success); font-family: 'DM Mono', monospace; font-weight: 500; }
    .amount-neg { color: var(--danger); font-family: 'DM Mono', monospace; font-weight: 500; }
    .amount-neutral { font-family: 'DM Mono', monospace; font-weight: 500; }

    /* BADGE */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
    }
    .badge-personal { background: rgba(96,165,250,0.15); color: var(--personal); }
    .badge-family { background: rgba(251,146,60,0.15); color: var(--family); }
    .badge-agency { background: rgba(167,139,250,0.15); color: var(--agency); }
    .badge-income { background: rgba(52,211,153,0.15); color: var(--success); }
    .badge-expense { background: rgba(248,113,113,0.15); color: var(--danger); }
    .badge-pending { background: rgba(251,191,36,0.15); color: var(--warning); }
    .badge-paid { background: rgba(52,211,153,0.15); color: var(--success); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.2s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 24px 28px; }
    .modal-footer { padding: 20px 28px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

    /* FORM */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-control:focus { border-color: var(--accent); background: #fff; }
    .form-control::placeholder { color: var(--muted); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* PERSON CHIPS */
    .person-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .person-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .person-chip.selected { border-color: var(--accent); }

    /* PROGRESS BAR */
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

    /* TABS */
    .tabs { display: flex; gap: 4px; background: #e2e8f0; padding: 4px; border-radius: 10px; margin-bottom: 24px; }
    .tab {
      flex: 1;
      padding: 9px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--muted);
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
    }
    .tab.active { background: #ffffff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

    /* PERSON SUMMARY CARD */
    .person-summary {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .person-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      flex-shrink: 0;
    }
    .person-info { flex: 1; }
    .person-name { font-weight: 600; font-size: 14px; }
    .person-amount { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent); }

    /* ACTION ICONS */
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 5px;
      color: var(--muted);
      transition: all 0.15s;
      font-size: 14px;
    }
    .action-btn:hover { background: var(--border); color: var(--text); }
    .action-btn.del:hover { color: var(--danger); }

    /* RESPONSIVE tweaks */
    @media (max-width: 768px) {
      .sidebar { width: 200px; }
      .main { margin-left: 200px; }
      .page { padding: 20px; }
    }

    /* NOTIFICATION */
    .notif {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      z-index: 500;
      animation: slideIn 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      color: var(--text);
    }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .notif.success { border-left: 3px solid var(--success); }
    .notif.error { border-left: 3px solid var(--danger); }

    /* TOOLTIP */
    .tooltip-wrap { position: relative; display: inline-flex; }
    .tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tooltip-wrap:hover .tooltip { opacity: 1; }

    /* SEARCH */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
    }
    .search-box input {
      background: none;
      border: none;
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 200px;
    }
    .search-box input::placeholder { color: var(--muted); }

    .color-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ==================== UTILS ====================
const fmt = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
const fmtDate = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR') : '-';
const fmtMonth = (m) => { const [y, mo] = m.split('-'); return new Date(y, mo-1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); };
const nowMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const todayStr = () => new Date().toISOString().split('T')[0];
const uid = () => Math.random().toString(36).slice(2,10);

const COLORS = ['#fb923c','#60a5fa','#a78bfa','#34d399','#f472b6','#fbbf24','#38bdf8','#4ade80'];
const CATEGORY_ICONS = {
  'Alimentação':'🍽️','Transporte':'🚗','Saúde':'🏥','Lazer':'🎮','Roupas':'👕',
  'Eletrônicos':'📱','Mercado':'🛒','Combustível':'⛽','Farmácia':'💊','Educação':'📚',
  'Serviços':'🔧','Hotel':'🏨','Passagem':'✈️','Pacote':'📦','Outro':'📝',
  'Salário':'💰','Freelance':'💼','Comissão':'📊','Reembolso':'↩️',
};
const CAT_EXPENSE = ['Alimentação','Transporte','Saúde','Lazer','Roupas','Eletrônicos','Mercado','Combustível','Farmácia','Educação','Serviços','Hotel','Passagem','Pacote','Outro'];
const CAT_INCOME  = ['Salário','Freelance','Comissão','Reembolso','Outro'];
const CAT_AGENCY  = ['Hotel','Passagem','Pacote','Serviços','Outro'];

// ==================== STORAGE ====================
const load = (k, def) => { try { const d = localStorage.getItem(k); return d ? JSON.parse(d) : def; } catch { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ==================== INITIAL DATA ====================
const DEFAULT_PEOPLE = [
  { id:'p1', name:'Mãe',    color:'#fb923c', emoji:'👩' },
  { id:'p2', name:'Pai',    color:'#60a5fa', emoji:'👨' },
  { id:'p3', name:'Irmão',  color:'#a78bfa', emoji:'🧑' },
];

// ==================== NOTIFICATION ====================
function Notif({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, []);
  return <div className={`notif ${type}`}><span>{type==='success'?'✅':'❌'}</span>{msg}</div>;
}

// ==================== MODAL ====================
function Modal({ title, onClose, children, footer }) {
  useEffect(() => {
    const h = (e) => { if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ==================== DASHBOARD ====================
function Dashboard({ transactions, people, month }) {
  const filtered = transactions.filter(t => t.month === month);
  const totalExp = filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const totalInc = filtered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const familyExp = filtered.filter(t=>t.module==='family' && t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const personalExp = filtered.filter(t=>t.module==='personal' && t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const agencyExp = filtered.filter(t=>t.module==='agency').reduce((s,t)=>s+t.amount,0);
  const agencyInc = filtered.filter(t=>t.module==='agency' && t.type==='income').reduce((s,t)=>s+t.amount,0);
  const balance = totalInc - totalExp;

  const catMap = {};
  filtered.filter(t=>t.type==='expense').forEach(t=>{
    catMap[t.category] = (catMap[t.category]||0) + t.amount;
  });
  const topCats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const personTotals = people.map(p=>({
    ...p,
    total: filtered.filter(t=>t.module==='family' && t.personId===p.id && t.type==='expense').reduce((s,t)=>s+t.amount,0)
  })).filter(p=>p.total>0).sort((a,b)=>b.total-a.total);

  const last7 = [...filtered].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);

  return (
    <div className="page">
      <div className="stats-grid">
        <div className="stat-card yellow">
          <div className="stat-label">💰 Receita Total</div>
          <div className="stat-value" style={{color:'var(--success)'}}>{fmt(totalInc)}</div>
          <div className="stat-sub">no mês</div>
        </div>
        <div className="stat-card red">
          <div className="stat-label">💸 Despesa Total</div>
          <div className="stat-value" style={{color:'var(--danger)'}}>{fmt(totalExp)}</div>
          <div className="stat-sub">no mês</div>
        </div>
        <div className="stat-card green">
          <div className="stat-label">📊 Saldo</div>
          <div className="stat-value" style={{color: balance>=0 ? 'var(--success)' : 'var(--danger)'}}>{fmt(balance)}</div>

function AddTransactionModal({ onClose, onSave, people, defaultModule }) {
  const [form, setForm] = useState({
    module: defaultModule || 'personal',
    type: 'expense',
    description: '',
    amount: '',
    category: '',
    date: todayStr(),
    personId: '',
    paymentMethod: 'Cartão de Crédito',
    notes: '',
    status: 'paid',
  });

  const set = (k, v) => setForm(f=>({...f, [k]:v}));
  const cats = form.module==='agency' ? CAT_AGENCY : form.type==='income' ? CAT_INCOME : CAT_EXPENSE;

  const handleSave = () => {
    if(!form.description || !form.amount || !form.category || !form.date) return alert('Preencha todos os campos obrigatórios');
    if(form.module==='family' && !form.personId) return alert('Selecione o parente');
    onSave({ ...form, id: uid(), amount: parseFloat(form.amount), month: form.date.slice(0,7) });

  return (
    <Modal title="➕ Novo Lançamento" onClose={onClose} footer={

            <button key={v} className={`tab ${form.module===v?'active':''}`} onClick={()=>set('module',v)}>{l}</button>

        </div>
      </div>

      {form.module !== 'agency' && (
        <div className="form-group">
          <label className="form-label">Tipo</label>
          <div className="tabs" style={{marginBottom:0}}>
            <button className={`tab ${form.type==='expense'?'active':''}`} onClick={()=>set('type','expense')}>💸 Despesa</button>
            <button className={`tab ${form.type==='income'?'active':''}`} onClick={()=>set('type','income')}>💰 Receita</button>

        </div>
      )}

      {form.module === 'family' && (
        <div className="form-group">
          <label className="form-label">Parente *</label>
          <div className="person-chips">
            {people.map(p=>(
              <span key={p.id} className={`person-chip ${form.personId===p.id?'selected':''}`}

      <div className="form-row">

// ==================== TRANSACTIONS TABLE ====================
function TransactionsTable({ transactions, people, onDelete, title, showPerson=false }) {
  const [search, setSearch] = useState('');
  const [filterType, setFilterType] = useState('all');

  const filtered = transactions.filter(t=>{
    const q = search.toLowerCase();
    const matchQ = !q || t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q);
    const matchT = filterType==='all' || t.type===filterType;
    return matchQ && matchT;
  });

  const getPerson = (id) => people.find(p=>p.id===id);

  return (
    <div className="section-card">
      <div className="section-header">
        <span className="section-title">{title}</span>
        <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
          <div className="search-box">
            <span>🔍</span>
            <input placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)} />
          </div>
          <select className="form-control" style={{width:'auto',padding:'7px 10px',fontSize:'12px'}} value={filterType} onChange={e=>setFilterType(e.target.value)}>
            <option value="all">Todos</option>
            <option value="expense">Despesas</option>
            <option value="income">Receitas</option>
          </select>
        </div>
      </div>
      {filtered.length === 0
        ? <div className="empty-state"><div className="empty-icon">🔍</div><div className="empty-title">Nenhum resultado</div></div>
        : <table>
            <thead>
              <tr>
                <th>Descrição</th>
                {showPerson && <th>Parente</th>}
                <th>Categoria</th>
                <th>Data</th>
                <th>Pagamento</th>
                <th>Status</th>
                <th style={{textAlign:'right'}}>Valor</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(t=>{
                const p = getPerson(t.personId);
                return (
                  <tr key={t.id}>
                    <td>
                      <div style={{fontWeight:500}}>{CATEGORY_ICONS[t.category]||'📝'} {t.description}</div>
                      {t.notes && <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px'}}>{t.notes}</div>}
                    </td>
                    {showPerson && <td>{p ? <span className="person-chip" style={{background:p.color+'22',color:p.color,border:'none',padding:'3px 10px'}}>{p.emoji} {p.name}</span> : '-'}</td>}
                    <td><span className="badge" style={{background:'rgba(255,255,255,0.06)',color:'var(--text)'}}>{CATEGORY_ICONS[t.category]||'📝'} {t.category}</span></td>
                    <td style={{fontFamily:'DM Mono',fontSize:'12px'}}>{fmtDate(t.date)}</td>
                    <td style={{fontSize:'12px',color:'var(--muted)'}}>{t.paymentMethod}</td>
                    <td><span className={`badge badge-${t.status}`}>{t.status==='paid'?'✅ Pago':'⏳ Pendente'}</span></td>
                    <td style={{textAlign:'right'}}><span className={t.type==='expense'?'amount-neg':'amount-pos'}>{t.type==='expense'?'−':'+' }{fmt(t.amount)}</span></td>
                    <td>
                      <button className="action-btn del" onClick={()=>onDelete(t.id)} title="Excluir">🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
      }
    </div>
  );
}

// ==================== FAMILY MODULE ====================
function FamilyModule({ transactions, people, onDelete, month, onManagePeople }) {
  const [activeTab, setActiveTab] = useState('summary');
  const filtered = transactions.filter(t=>t.module==='family' && t.month===month);

  const personData = people.map(p=>{
    const txs = filtered.filter(t=>t.personId===p.id);
    return { ...p, transactions: txs, total: txs.reduce((s,t)=>s+t.amount,0) };
  });

  const totalFamily = filtered.reduce((s,t)=>s+t.amount,0);

  const handleCopyReport = (p) => {
    const lines = [`📋 *Relatório de Gastos — ${p.name}*\n`,`Mês: ${fmtMonth(month)}\n`,'─'.repeat(30)+'\n'];
    p.transactions.forEach(t=>{
      lines.push(`• ${fmtDate(t.date)} — ${t.description}: ${fmt(t.amount)}`);
    });
    lines.push('\n─'.repeat(30));
    lines.push(`\n*Total a pagar: ${fmt(p.total)}*`);
    lines.push('\nChave PIX: [sua-chave-pix]');
    navigator.clipboard.writeText(lines.join('\n'));
  };

  return (
    <div className="page">
      <div className="stats-grid">
        <div className="stat-card orange">
          <div className="stat-label">💳 Total no Cartão</div>
          <div className="stat-value" style={{color:'var(--family)'}}>{fmt(totalFamily)}</div>
          <div className="stat-sub">{people.length} parentes</div>
        </div>
        {personData.map(p=>(
          <div key={p.id} className="stat-card" style={{borderTop:'3px solid '+p.color}}>
            <div className="stat-label">{p.emoji} {p.name}</div>
            <div className="stat-value" style={{color:p.color}}>{fmt(p.total)}</div>
            <div className="stat-sub">{p.transactions.length} lançamento(s)</div>
          </div>
        ))}
      </div>

      <div className="tabs">
        <button className={`tab ${activeTab==='summary'?'active':''}`} onClick={()=>setActiveTab('summary')}>📊 Cobranças</button>
        <button className={`tab ${activeTab==='all'?'active':''}`} onClick={()=>setActiveTab('all')}>📋 Todos os Lançamentos</button>
        <button className={`tab ${activeTab==='people'?'active':''}`} onClick={()=>setActiveTab('people')}>👥 Gerenciar Parentes</button>
      </div>

      {activeTab === 'summary' && (
        <div>
          {personData.filter(p=>p.total>0).length === 0
            ? <div className="section-card"><div className="empty-state"><div className="empty-icon">🎉</div><div className="empty-title">Nenhum gasto de parente este mês</div></div></div>
            : personData.filter(p=>p.total>0).map(p=>(
              <div key={p.id} className="section-card" style={{marginBottom:'24px'}}>
                <div className="section-header">
                  <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                    <div className="person-avatar" style={{width:36,height:36,background:p.color+'22',color:p.color,fontSize:14}}>{p.emoji}</div>
                    <span className="section-title">{p.name}</span>
                    <span className="badge" style={{background:p.color+'22',color:p.color}}>a cobrar: {fmt(p.total)}</span>
                  </div>
                  <div style={{display:'flex',gap:'8px'}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>handleCopyReport(p)}>📋 Copiar Relatório</button>
                  </div>
                </div>
                <table>
                  <thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th style={{textAlign:'right'}}>Valor</th></tr></thead>
                  <tbody>
                    {p.transactions.map(t=>(
                      <tr key={t.id}>
                        <td><div style={{fontWeight:500}}>{t.description}</div></td>
                        <td><span style={{fontSize:'12px',color:'var(--muted)'}}>{CATEGORY_ICONS[t.category]||'📝'} {t.category}</span></td>
                        <td style={{fontFamily:'DM Mono',fontSize:'12px'}}>{fmtDate(t.date)}</td>
                        <td style={{textAlign:'right'}}><span className="amount-neg">{fmt(t.amount)}</span></td>
                      </tr>
                    ))}
                    <tr>
                      <td colSpan="3" style={{fontWeight:700,fontFamily:'Syne',fontSize:'14px'}}>TOTAL A COBRAR</td>
                      <td style={{textAlign:'right'}}><span className="amount-neg" style={{fontSize:'16px',fontFamily:'Syne',fontWeight:700}}>{fmt(p.total)}</span></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            ))
          }
        </div>
      )}

      {activeTab === 'all' && (
        <TransactionsTable transactions={filtered} people={people} onDelete={onDelete} title="Todos os Gastos de Parentes" showPerson />
      )}

      {activeTab === 'people' && (
        <PeopleManager people={people} onManagePeople={onManagePeople} />
      )}

  );
}

// ==================== PEOPLE MANAGER ====================
function PeopleManager({ people, onManagePeople }) {
  const [adding, setAdding] = useState(false);
  const [newPerson, setNewPerson] = useState({ name:'', emoji:'😊', color: COLORS[0] });

  const handleAdd = () => {
    if(!newPerson.name) return;
    onManagePeople([...people, { id: uid(), ...newPerson }]);
    setNewPerson({ name:'', emoji:'😊', color: COLORS[0] });
    setAdding(false);
  };

  const handleRemove = (id) => {
    if(confirm('Remover este parente?')) onManagePeople(people.filter(p=>p.id!==id));
  };

  return (
    <div className="section-card">
      <div className="section-header">
        <span className="section-title">👥 Parentes Cadastrados</span>
        <button className="btn btn-primary btn-sm" onClick={()=>setAdding(true)}>+ Adicionar</button>
      </div>
      <div style={{padding:'16px'}}>
        {people.map(p=>(
          <div key={p.id} className="person-summary">
            <div className="person-avatar" style={{background:p.color+'33',color:p.color}}>{p.emoji}</div>
            <div className="person-info"><div className="person-name">{p.name}</div></div>
            <button className="action-btn del" onClick={()=>handleRemove(p.id)}>🗑️</button>
          </div>
        ))}
        {adding && (
          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:16,marginTop:12}}>
            <div className="form-row">
              <div className="form-group">
                <label className="form-label">Nome</label>
                <input className="form-control" placeholder="Ex: Mãe" value={newPerson.name} onChange={e=>setNewPerson(n=>({...n,name:e.target.value}))} />
              </div>
              <div className="form-group">
                <label className="form-label">Emoji</label>
                <input className="form-control" placeholder="😊" value={newPerson.emoji} onChange={e=>setNewPerson(n=>({...n,emoji:e.target.value}))} />
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Cor</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {COLORS.map(c=>(
                  <div key={c} onClick={()=>setNewPerson(n=>({...n,color:c}))}
                    style={{width:28,height:28,borderRadius:'50%',background:c,cursor:'pointer',
                      border: newPerson.color===c ? '3px solid white' : '3px solid transparent',transition:'border 0.1s'}}/>
                ))}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-primary btn-sm" onClick={handleAdd}>Salvar</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setAdding(false)}>Cancelar</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ==================== PERSONAL MODULE ====================
function PersonalModule({ transactions, people, onDelete, month }) {
  const filtered = transactions.filter(t=>t.module==='personal' && t.month===month);
  const income = filtered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;

  const catMap = {};
  filtered.filter(t=>t.type==='expense').forEach(t=>{ catMap[t.category]=(catMap[t.category]||0)+t.amount; });
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

  return (
    <div className="page">
      <div className="stats-grid">
        <div className="stat-card green"><div className="stat-label">💰 Receitas</div><div className="stat-value" style={{color:'var(--success)'}}>{fmt(income)}</div></div>
        <div className="stat-card red"><div className="stat-label">💸 Despesas</div><div className="stat-value" style={{color:'var(--danger)'}}>{fmt(expense)}</div></div>
        <div className="stat-card yellow"><div className="stat-label">📊 Saldo</div><div className="stat-value" style={{color:balance>=0?'var(--success)':'var(--danger)'}}>{fmt(balance)}</div></div>
        <div className="stat-card blue"><div className="stat-label">📝 Lançamentos</div><div className="stat-value" style={{color:'var(--personal)'}}>{filtered.length}</div></div>
      </div>

      <div className="two-col">
        <TransactionsTable transactions={filtered} people={people} onDelete={onDelete} title="💳 Meus Gastos Pessoais" />

        <div className="section-card" style={{height:'fit-content'}}>
          <div className="section-header"><span className="section-title">📊 Por Categoria</span></div>
          <div style={{padding:'16px'}}>
            {cats.length===0
              ? <div style={{textAlign:'center',padding:24,color:'var(--muted)'}}>Sem dados</div>
              : cats.map(([cat,val])=>(
                <div key={cat} style={{marginBottom:14}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                    <span style={{fontSize:13}}>{CATEGORY_ICONS[cat]||'📝'} {cat}</span>
                    <span style={{fontFamily:'DM Mono',fontSize:13}}>{fmt(val)}</span>
                  </div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{width:`${Math.min((val/expense)*100,100)}%`,background:'var(--personal)'}}/>
                  </div>
                </div>
              ))
            }
          </div>
        </div>
      </div>
    </div>
  );
}

}

// ==================== REPORTS ====================
function Reports({ transactions, people, month }) {
  const [selectedMonth, setSelectedMonth] = useState(month);

  const months = useMemo(()=>{
    const m = new Set(transactions.map(t=>t.month));
    m.add(nowMonth());
    return [...m].sort().reverse();
  }, [transactions]);

  const filtered = transactions.filter(t=>t.month===selectedMonth);
  const byMod = (mod) => filtered.filter(t=>t.module===mod);

  const personalInc = byMod('personal').filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const personalExp = byMod('personal').filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const familyExp = byMod('family').reduce((s,t)=>s+t.amount,0);
  const agencyInc = byMod('agency').filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const agencyExp = byMod('agency').filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

  const handleExportCSV = () => {
    const rows = [['Data','Descrição','Módulo','Tipo','Categoria','Parente','Valor','Pagamento','Status','Observações']];
    filtered.forEach(t=>{
      const p = people.find(x=>x.id===t.personId);
      rows.push([t.date,t.description,t.module,t.type,t.category,p?p.name:'',t.amount,t.paymentMethod,t.status,t.notes||'']);
    });
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
    a.download = `financeiro-${selectedMonth}.csv`;
    a.click();
  };

  return (
    <div className="page">
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:24}}>
        <select className="form-control" style={{width:'auto'}} value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)}>
          {months.map(m=><option key={m} value={m}>{fmtMonth(m)}</option>)}
        </select>
        <button className="btn btn-ghost" onClick={handleExportCSV}>📥 Exportar CSV</button>
      </div>

      <div className="stats-grid" style={{marginBottom:32}}>
        <div className="stat-card blue"><div className="stat-label">👤 Pessoal — Receita</div><div className="stat-value" style={{color:'var(--success)'}}>{fmt(personalInc)}</div></div>
        <div className="stat-card blue"><div className="stat-label">👤 Pessoal — Despesa</div><div className="stat-value" style={{color:'var(--danger)'}}>{fmt(personalExp)}</div></div>
        <div className="stat-card orange"><div className="stat-label">👨‍👩‍👧 Família — A Cobrar</div><div className="stat-value" style={{color:'var(--family)'}}>{fmt(familyExp)}</div></div>
        <div className="stat-card purple"><div className="stat-label">✈️ Agência — Receita</div><div className="stat-value" style={{color:'var(--success)'}}>{fmt(agencyInc)}</div></div>
        <div className="stat-card purple"><div className="stat-label">✈️ Agência — Despesa</div><div className="stat-value" style={{color:'var(--danger)'}}>{fmt(agencyExp)}</div></div>
        <div className="stat-card yellow"><div className="stat-label">📊 Total Geral</div><div className="stat-value" style={{color:personalInc+agencyInc-personalExp-agencyExp>=0?'var(--success)':'var(--danger)'}}>{fmt(personalInc+agencyInc-personalExp-agencyExp)}</div></div>
      </div>

      <div className="section-card">
        <div className="section-header"><span className="section-title">📊 Cobrança por Parente — {fmtMonth(selectedMonth)}</span></div>
        <div style={{padding:16}}>
          {people.map(p=>{
            const txs = filtered.filter(t=>t.module==='family' && t.personId===p.id);
            const total = txs.reduce((s,t)=>s+t.amount,0);
            if(!total) return null;
            return (
              <div key={p.id} className="person-summary">
                <div className="person-avatar" style={{background:p.color+'33',color:p.color}}>{p.emoji}</div>
                <div className="person-info">
                  <div className="person-name">{p.name}</div>
                  <div style={{fontSize:12,color:'var(--muted)'}}>{txs.length} itens</div>
                </div>
                <span className="person-amount">{fmt(total)}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ==================== FATURA IMPORT ====================

const fileToBase64 = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]);
  r.onerror = rej;
  r.readAsDataURL(file);
});

const buildClassificationContext = (mem) => {
  const entries = Object.entries(mem);
  if (!entries.length) return '';
  const lines = entries.slice(-60).map(([key, val]) => {
    const who = val.personName ? 'parente:' + val.personName : val.module === 'agency' ? 'agencia' : 'pessoal';
    return '"' + key + '" -> ' + who + ' | categoria: ' + val.category;
  });
  return '\nHistorico de classificacoes (use para sugerir automaticamente):\n' + lines.join('\n');
};

function FaturaImport({ people, onImportTransactions, classificationMemory, onSaveMemory }) {
  const [step, setStep] = useState('upload');
  const [files, setFiles] = useState([]);          // supports multiple images
  const [inputMode, setInputMode] = useState('pdf'); // 'pdf' | 'image' | 'csv'
  const [cardName, setCardName] = useState('');
  const [apiKey, setApiKey] = useState(() => load('fin_apikey', ''));
  const [items, setItems] = useState([]);
  const [processing, setProcessing] = useState(false);
  const [error, setError] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [progress, setProgress] = useState('');
  const [showKey, setShowKey] = useState(false);
  const [previews, setPreviews] = useState([]);    // image preview URLs

  const saveApiKey = (k) => { setApiKey(k); save('fin_apikey', k); };

  const IMAGE_TYPES = ['image/jpeg','image/jpg','image/png','image/webp','image/gif'];

  const handleFiles = (fileList) => {
    const arr = Array.from(fileList);
    if (inputMode === 'pdf') {
      const f = arr[0];
      if (!f || f.type !== 'application/pdf') { setError('Envie um arquivo PDF.'); return; }
      setFiles([f]); setPreviews([]); setError('');
    } else if (inputMode === 'csv') {
      const f = arr[0];
      if (!f || (!f.name.endsWith('.csv') && f.type !== 'text/csv')) { setError('Envie um arquivo .CSV.'); return; }
      setFiles([f]); setPreviews([]); setError('');
    } else {
      const imgs = arr.filter(f => IMAGE_TYPES.includes(f.type));
      if (!imgs.length) { setError('Envie imagens JPG, PNG ou WebP.'); return; }
      setFiles(prev => [...prev, ...imgs]);
      imgs.forEach(f => {
        const reader = new FileReader();
        reader.onload = e => setPreviews(prev => [...prev, { name: f.name, url: e.target.result }]);
        reader.readAsDataURL(f);
      });
      setError('');
    }
  };

  const removeFile = (idx) => {
    setFiles(prev => prev.filter((_,i) => i !== idx));
    setPreviews(prev => prev.filter((_,i) => i !== idx));
  };

  const handleDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    handleFiles(e.dataTransfer.files);
  };

  const switchMode = (mode) => {
    setInputMode(mode); setFiles([]); setPreviews([]); setError('');
  };

  const processInvoice = async () => {
    if (!files.length) return setError(inputMode === 'pdf' ? 'Selecione um PDF.' : inputMode === 'csv' ? 'Selecione um arquivo CSV.' : 'Adicione ao menos um print.');
    if (!apiKey) return setError('Informe sua chave de API Anthropic.');
    setProcessing(true); setError(''); setProgress('Preparando arquivo...');
    try {
      const ctx = buildClassificationContext(classificationMemory);
      const peopleList = people.map(p => p.id + ':' + p.name).join(', ');

      const systemPrompt = `Voce e um assistente especializado em extrair e classificar lancamentos de faturas de cartao de credito brasileiras.

Pessoas cadastradas (id:nome): ${peopleList}
Modulos: personal (titular), family (parente no cartao), agency (PrimeWay Viagens)
Categorias: Alimentacao, Transporte, Saude, Lazer, Roupas, Eletronicos, Mercado, Combustivel, Farmacia, Educacao, Servicos, Hotel, Passagem, Pacote, Outro
${ctx}

Retorne SOMENTE JSON valido sem markdown:
{"items":[{"description":"nome exato do estabelecimento","amount":0.00,"date":"YYYY-MM-DD","installment":"1/10 ou null","category":"categoria","module":"personal|family|agency","personId":"id ou null","confidence":"high|medium|low","reason":"motivo breve"}]}

Regras:
- Extraia TODOS os lancamentos visiveis, inclusive parcelas
- Para parcelas inclua o numero no campo installment ex: "3/10"
- Valores como numero float sem R$
- Se for print parcial, extraia apenas o que estiver visivel
- Use historico para sugerir module e personId automaticamente
- confidence high=encontrou no historico, medium=inferiu pelo tipo, low=novo`;

      // ---- CSV: parse locally, no AI needed ----
      if (inputMode === 'csv') {
        setProgress('Lendo CSV...');
        const text = await files[0].text();
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (!lines.length) throw new Error('Arquivo CSV vazio.');

        // Detect separator
        const sep = lines[0].includes(';') ? ';' : ',';

        // Parse header
        const headers = lines[0].split(sep).map(h => h.replace(/^["']|["']$/g,'').trim().toLowerCase());

        // Column mapping — handles common Brazilian bank CSV exports
        const colMap = {
          date:   headers.findIndex(h => /data|date/.test(h)),
          desc:   headers.findIndex(h => /descri|estabele|hist|lancamento|title|name|merchant/.test(h)),
          amount: headers.findIndex(h => /valor|amount|value|total/.test(h)),
          inst:   headers.findIndex(h => /parcela|installment/.test(h)),
          cat:    headers.findIndex(h => /categ/.test(h)),
        };

        const parseAmt = (v) => {
          if (!v) return 0;
          // Remove currency symbols and spaces, handle Brazilian format (1.234,56 or 1234.56)
          let s = v.toString().replace(/[R$\s]/g,'').trim();
          // If both . and , present: . is thousands separator, , is decimal
          if (s.includes('.') && s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
          else if (s.includes(',')) s = s.replace(',','.');
          return Math.abs(parseFloat(s)) || 0;
        };

        const parseDate = (v) => {
          if (!v) return todayStr();
          v = v.replace(/["']/g,'').trim();
          // DD/MM/YYYY
          if (/^\d{2}\/\d{2}\/\d{4}$/.test(v)) {
            const [d,m,y] = v.split('/'); return y+'-'+m+'-'+d;
          }
          // YYYY-MM-DD already
          if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
          // DD-MM-YYYY
          if (/^\d{2}-\d{2}-\d{4}$/.test(v)) {
            const [d,m,y] = v.split('-'); return y+'-'+m+'-'+d;
          }
          return todayStr();
        };

        const getCell = (row, idx) => idx >= 0 && idx < row.length ? row[idx].replace(/^["']|["']$/g,'').trim() : '';

        const enriched = [];
        for (let i = 1; i < lines.length; i++) {
          const row = lines[i].split(sep);
          const desc = colMap.desc >= 0 ? getCell(row, colMap.desc) : '';
          const rawAmt = colMap.amount >= 0 ? getCell(row, colMap.amount) : '';
          const amount = parseAmt(rawAmt);
          if (!desc || !amount) continue;

          const date = parseDate(colMap.date >= 0 ? getCell(row, colMap.date) : '');
          const installment = colMap.inst >= 0 ? getCell(row, colMap.inst) || null : null;
          const csvCat = colMap.cat >= 0 ? getCell(row, colMap.cat) : '';

          // Check memory for classification suggestion
          const key = desc.toLowerCase().trim().slice(0,50);
          const mem = classificationMemory[key];
          const confidence = mem ? 'high' : 'low';
          const module = mem ? (mem.module || 'personal') : 'personal';
          const personId = mem ? (mem.personId || null) : null;
          const category = mem ? mem.category : (csvCat || 'Outro');

          enriched.push({
            id: uid(), description: desc, amount, date,
            installment: installment || null,
            category, module, personId,
            type: 'expense', paymentMethod: 'Cartao de Credito',
            status: 'paid', month: date.slice(0,7),
            cardLabel: cardName || '', approved: false,
            confidence, reason: mem ? 'Encontrado no historico' : (csvCat ? 'Categoria do CSV' : 'Novo lancamento'),
          });
        }

        if (!enriched.length) throw new Error('Nenhum lancamento encontrado no CSV. Verifique o formato do arquivo.');
        setItems(enriched); setStep('review');
        setProcessing(false); setProgress('');
        return;
      }

      setProgress('Enviando para IA...');
      let messageContent = [];

      if (inputMode === 'pdf') {
        const base64 = await fileToBase64(files[0]);
        messageContent = [
          { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } },
          { type: 'text', text: 'Extraia todos os lancamentos desta fatura' + (cardName ? ' do ' + cardName : '') + '. Retorne apenas o JSON.' }
        ];
      } else {
        // Multiple images — send all, then ask for JSON
        for (let i = 0; i < files.length; i++) {
          setProgress(`Processando imagem ${i+1} de ${files.length}...`);
          const base64 = await fileToBase64(files[i]);
          const mime = files[i].type || 'image/jpeg';
          messageContent.push({ type: 'image', source: { type: 'base64', media_type: mime, data: base64 } });
        }
        const imgDesc = files.length > 1
          ? `Estas ${files.length} imagens sao prints de tela de uma fatura` + (cardName ? ' do ' + cardName : '') + '. Extraia todos os lancamentos visiveis em todas as imagens e retorne apenas o JSON consolidado.'
          : 'Este print de tela mostra lancamentos de fatura' + (cardName ? ' do ' + cardName : '') + '. Extraia todos os lancamentos visiveis e retorne apenas o JSON.';
        messageContent.push({ type: 'text', text: imgDesc });
      }

      setProgress('Aguardando resposta da IA...');
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5',
          max_tokens: 4000,
          system: systemPrompt,
          messages: [{ role: 'user', content: messageContent }],
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || 'Erro ' + response.status);
      }
      setProgress('Processando resposta...');
      const data = await response.json();
      const text = data.content.map(c => c.text || '').join('');
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      const enriched = parsed.items.map(item => ({
        ...item, id: uid(), type: 'expense', paymentMethod: 'Cartao de Credito',
        status: 'paid', month: item.date ? item.date.slice(0,7) : nowMonth(),
        cardLabel: cardName || '', approved: false,
      }));
      setItems(enriched); setStep('review');
    } catch(e) {
      setError('Erro: ' + e.message);
    } finally { setProcessing(false); setProgress(''); }
  };

  const updateItem = (id, changes) => setItems(prev => prev.map(it => it.id===id ? {...it,...changes} : it));
  const toggleApprove = (id) => setItems(prev => prev.map(it => it.id===id ? {...it,approved:!it.approved} : it));
  const approveAll = () => setItems(prev => prev.map(it => ({...it, approved:true})));
  const unapproveAll = () => setItems(prev => prev.map(it => ({...it, approved:false})));

  const handleImport = () => {
    const approved = items.filter(it => it.approved);
    if (!approved.length) return setError('Aprove ao menos um lancamento.');
    const newMemory = {...classificationMemory};
    approved.forEach(it => {
      const key = it.description.toLowerCase().trim().slice(0,50);
      const person = people.find(p => p.id===it.personId);
      newMemory[key] = { module:it.module, personId:it.personId||null, personName:person?.name||null, category:it.category, updatedAt:new Date().toISOString() };
    });
    onSaveMemory(newMemory);
    const toImport = approved.map(({approved,confidence,reason,cardLabel,installment,...tx}) => tx);
    onImportTransactions(toImport);
    setStep('done');
  };

  const reset = () => { setStep('upload'); setFiles([]); setPreviews([]); setItems([]); setError(''); };
  const cfColor = { high:'#16a34a', medium:'#d97706', low:'#94a3b8' };
  const cfLabel = { high:'Aprendido', medium:'Inferido', low:'Novo' };
  const cfEmoji = { high:'✅', medium:'🔍', low:'❓' };
  const getPerson = (id) => people.find(p => p.id===id);
  const approved = items.filter(i => i.approved);
  const totalApproved = approved.reduce((s,i) => s+i.amount, 0);

  if (step==='done') return (
    <div className="page">
      <div className="section-card" style={{textAlign:'center',padding:60}}>
        <div style={{fontSize:56,marginBottom:16}}>🎉</div>
        <div style={{fontFamily:'Syne',fontSize:24,fontWeight:700,marginBottom:8}}>{approved.length} lancamentos importados!</div>
        <div style={{color:'var(--muted)',marginBottom:32}}>A IA aprendeu as classificacoes e vai sugerir automaticamente na proxima vez.</div>
        <div style={{display:'flex',gap:12,justifyContent:'center'}}>
          <button className="btn btn-primary" onClick={reset}>📄 Importar outra fatura</button>
          <button className="btn btn-ghost" onClick={()=>{ reset(); }}>📊 Ver Dashboard</button>
        </div>
      </div>
    </div>
  );

  if (step==='review') return (
    <div className="page">
      <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{flex:1,minWidth:200}}>
          <div style={{fontFamily:'Syne',fontSize:18,fontWeight:700}}>📋 Revisar {items.length} lancamentos extraidos</div>
          <div style={{color:'var(--muted)',fontSize:13,marginTop:4}}>{approved.length} aprovados · Total: {fmt(totalApproved)}</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={unapproveAll}>Desmarcar todos</button>
        <button className="btn btn-ghost btn-sm" onClick={approveAll}>✅ Aprovar todos</button>
        <button className="btn btn-primary" onClick={handleImport}>⬇️ Importar ({approved.length})</button>
        <button className="btn btn-ghost btn-sm" onClick={reset}>Cancelar</button>
      </div>

      {error && <div style={{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:8,padding:'10px 16px',marginBottom:16,color:'#dc2626',fontSize:13}}>{error}</div>}

      <div style={{display:'flex',gap:16,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        {Object.keys(cfLabel).map(k => (
          <span key={k} style={{fontSize:12,color:cfColor[k],fontWeight:600,background:cfColor[k]+'15',padding:'3px 10px',borderRadius:20}}>
            {cfEmoji[k]} {cfLabel[k]}
          </span>
        ))}
        <span style={{fontSize:12,color:'var(--muted)'}}>Edite qualquer campo antes de importar</span>
      </div>

      <div className="section-card">
        <table>
          <thead><tr>
            <th style={{width:40,textAlign:'center'}}>
              <input type="checkbox" onChange={e => e.target.checked ? approveAll() : unapproveAll()} />
            </th>
            <th>Descricao</th>
            <th>Data</th>
            <th>Modulo / Parente</th>
            <th>Categoria</th>
            <th style={{textAlign:'right'}}>Valor</th>
            <th>Status IA</th>
          </tr></thead>
          <tbody>
            {items.map(item => {
              const person = getPerson(item.personId);
              return (
                <tr key={item.id} style={{opacity:item.approved?1:0.4}}>
                  <td style={{textAlign:'center'}}>
                    <input type="checkbox" checked={item.approved} onChange={() => toggleApprove(item.id)} />
                  </td>
                  <td>
                    <div style={{fontWeight:600,fontSize:13}}>{item.description}</div>
                    {item.installment && <div style={{fontSize:11,color:'var(--accent)',marginTop:2,fontFamily:'DM Mono'}}>Parcela {item.installment}</div>}
                    {item.reason && <div style={{fontSize:11,color:'var(--muted)',fontStyle:'italic',marginTop:1}}>{item.reason}</div>}
                  </td>
                  <td>
                    <input type="date" className="form-control" style={{padding:'5px 8px',fontSize:12,width:136}}
                      value={item.date||''} onChange={e => updateItem(item.id,{date:e.target.value,month:e.target.value.slice(0,7)})} />
                  </td>
                  <td style={{minWidth:190}}>
                    <select className="form-control" style={{padding:'5px 8px',fontSize:12,marginBottom:5}}
                      value={item.module} onChange={e => updateItem(item.id,{module:e.target.value,personId:e.target.value!=='family'?null:item.personId})}>
                      <option value="personal">👤 Pessoal</option>
                      <option value="family">👨‍👩‍👧 Familia</option>
                      <option value="agency">✈️ Agencia</option>
                    </select>
                    {item.module==='family' && (
                      <select className="form-control" style={{padding:'5px 8px',fontSize:12}}
                        value={item.personId||''} onChange={e => updateItem(item.id,{personId:e.target.value})}>
                        <option value="">Selecionar parente...</option>
                        {people.map(p => <option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}
                      </select>
                    )}
                    {item.module==='family' && person && (
                      <div style={{fontSize:12,color:person.color,fontWeight:700,marginTop:4}}>{person.emoji} {person.name}</div>
                    )}
                  </td>
                  <td>
                    <select className="form-control" style={{padding:'5px 8px',fontSize:12}}
                      value={item.category||'Outro'} onChange={e => updateItem(item.id,{category:e.target.value})}>
                      {CAT_EXPENSE.map(c => <option key={c} value={c}>{CATEGORY_ICONS[c]||'📝'} {c}</option>)}
                    </select>
                  </td>
                  <td style={{textAlign:'right'}}>
                    <span className="amount-neg" style={{fontFamily:'DM Mono',fontSize:13,fontWeight:600}}>{fmt(item.amount)}</span>
                  </td>
                  <td>
                    <span style={{fontSize:11,fontWeight:700,color:cfColor[item.confidence||'low'],

        {error && (

        <button className="btn btn-primary"
          style={{width:'100%',justifyContent:'center',padding:'15px',fontSize:15,borderRadius:10}}
          onClick={processInvoice} disabled={processing || !hasFiles}>

              ? '🤖 Extrair lançamentos do PDF'
              : inputMode === 'csv'
              ? '⚡ Importar CSV'

}

// ==================== COBRAR MODULE ====================

function CobrarModule({ transactions, people, month }) {
  const [selectedMonth, setSelectedMonth] = useState(month);
  const [pixKeys, setPixKeys] = useState(() => load('fin_pix_keys', {}));
  const [copied, setCopied] = useState({});
  const [editingPix, setEditingPix] = useState(null);
  const [pixInput, setPixInput] = useState('');
  const [preview, setPreview] = useState(null); // personId being previewed

  const savePixKeys = (k) => { setPixKeys(k); save('fin_pix_keys', k); };

  const months = [...new Set(transactions.map(t => t.month))].sort().reverse();
  if (!months.includes(selectedMonth) && months.length) months.unshift(selectedMonth);

  // Group transactions by person for selected month
  const personData = people.map(person => {
    const txs = transactions.filter(t =>
      t.module === 'family' &&
      t.personId === person.id &&
      t.month === selectedMonth &&
      t.type === 'expense'
    );

    // Group by cardName
    const byCard = {};
    txs.forEach(t => {
      const card = t.cardName || t.paymentMethod || 'Cartão';
      if (!byCard[card]) byCard[card] = [];
      byCard[card].push(t);
    });

    const total = txs.reduce((s, t) => s + t.amount, 0);
    return { ...person, transactions: txs, byCard, total };
  }).filter(p => p.total > 0);

  // Build message for one person
  const buildMessage = (person) => {
    const lines = [];
    lines.push(`Olá ${person.name}! 😊`);
    lines.push(`Aqui está o resumo dos gastos do mês de ${fmtMonth(selectedMonth)} no meu cartão:\n`);

    Object.entries(person.byCard).forEach(([card, txs]) => {
      const cardTotal = txs.reduce((s, t) => s + t.amount, 0);
      const pix = pixKeys[card];
      lines.push(`💳 *${card}* — Total: *${fmt(cardTotal)}*`);
      if (pix) lines.push(`   🔑 Chave PIX: \`${pix}\``);
      lines.push('');

      txs.forEach(t => {
        let desc = t.description;
        // detect installment in description or notes
        const instMatch = desc.match(/(\d+\/\d+)/);
        const inst = instMatch ? ` ${instMatch[1]}` : '';
        // clean desc from installment if already embedded
        const cleanDesc = desc.replace(/\s*\d+\/\d+\s*/g, '').trim();
        lines.push(`   • ${cleanDesc}${inst} — ${fmt(t.amount)}`);
      });
      lines.push('');
    });

    lines.push(`💰 *Total geral a pagar: ${fmt(person.total)}*`);
    lines.push('');
    lines.push('Obrigado! 🙏');
    return lines.join('\n');
  };

  const handleCopy = (personId, text) => {
    navigator.clipboard.writeText(text).then(() => {
      setCopied(prev => ({ ...prev, [personId]: true }));
      setTimeout(() => setCopied(prev => ({ ...prev, [personId]: false })), 2500);
    });
  };

  const handleWhatsApp = (text) => {
    const encoded = encodeURIComponent(text);
    window.open('https://wa.me/?text=' + encoded, '_blank');
  };

  const openPixEdit = (card) => {
    setEditingPix(card);
    setPixInput(pixKeys[card] || '');
  };

  const savePix = () => {
    if (editingPix) {
      savePixKeys({ ...pixKeys, [editingPix]: pixInput });
      setEditingPix(null);
      setPixInput('');
    }
  };

  // Collect all unique card names used in family txs
  const allCards = [...new Set(
    transactions.filter(t => t.module === 'family').map(t => t.cardName || t.paymentMethod || 'Cartão')
  )];

  return (
    <div className="page">
      {/* Header controls */}
      <div style={{ display: 'flex', gap: 12, marginBottom: 24, alignItems: 'center', flexWrap: 'wrap' }}>
        <select className="form-control" style={{ width: 'auto' }}
          value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
          {[...new Set([selectedMonth, ...months])].map(m => (
            <option key={m} value={m}>{fmtMonth(m)}</option>
          ))}
        </select>
        <span style={{ fontSize: 13, color: 'var(--muted)' }}>
          {personData.length} {personData.length === 1 ? 'pessoa' : 'pessoas'} com gastos neste mês
        </span>
      </div>

      {/* PIX Keys config */}
      <div className="section-card" style={{ marginBottom: 24 }}>
        <div className="section-header">
          <span className="section-title">🔑 Chaves PIX por Cartão</span>
          <span style={{ fontSize: 12, color: 'var(--muted)' }}>Aparecem automaticamente nas mensagens</span>
        </div>
        <div style={{ padding: '16px 24px' }}>
          {allCards.length === 0 && (
            <div style={{ fontSize: 13, color: 'var(--muted)', padding: '8px 0' }}>
              Nenhum gasto de família cadastrado ainda. Importe uma fatura ou adicione lançamentos.
            </div>
          )}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {allCards.map(card => (
              <div key={card} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ background: '#f1f5f9', borderRadius: 8, padding: '8px 14px',
                  fontSize: 13, fontWeight: 600, minWidth: 160, flexShrink: 0 }}>
                  💳 {card}
                </div>
                {editingPix === card ? (
                  <>
                    <input className="form-control" style={{ flex: 1 }} autoFocus
                      placeholder="CPF, email, telefone ou chave aleatória"
                      value={pixInput} onChange={e => setPixInput(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && savePix()} />
                    <button className="btn btn-primary btn-sm" onClick={savePix}>Salvar</button>
                    <button className="btn btn-ghost btn-sm" onClick={() => setEditingPix(null)}>✕</button>
                  </>
                ) : (
                  <>
                    <div style={{ flex: 1, fontFamily: 'DM Mono', fontSize: 13,
                      color: pixKeys[card] ? 'var(--text)' : 'var(--muted)',
                      background: '#f8fafc', border: '1px solid var(--border)',
                      borderRadius: 8, padding: '8px 14px' }}>
                      {pixKeys[card] || 'Chave PIX não configurada'}
                    </div>
                    <button className="btn btn-ghost btn-sm" onClick={() => openPixEdit(card)}>
                      ✏️ {pixKeys[card] ? 'Editar' : 'Adicionar'}
                    </button>
                  </>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Empty state */}
      {personData.length === 0 && (
        <div className="section-card">
          <div className="empty-state">
            <div className="empty-icon">📭</div>
            <div className="empty-title">Nenhum gasto de família em {fmtMonth(selectedMonth)}</div>
            <p style={{ color: 'var(--muted)', marginTop: 6, fontSize: 13 }}>
              Importe uma fatura ou adicione lançamentos no módulo Família / Cartão
            </p>
          </div>
        </div>
      )}

      {/* One card per person */}
      {personData.map(person => {
        const msg = buildMessage(person);
        const isCopied = copied[person.id];
        const isPreviewing = preview === person.id;

        return (
          <div key={person.id} className="section-card" style={{ marginBottom: 24 }}>
            {/* Person header */}
            <div className="section-header" style={{ background: person.color + '0d', borderBottom: '1px solid ' + person.color + '30' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div className="person-avatar"
                  style={{ width: 40, height: 40, background: person.color + '25', color: person.color, fontSize: 18, flexShrink: 0 }}>
                  {person.emoji}
                </div>
                <div>
                  <div style={{ fontFamily: 'Syne', fontSize: 16, fontWeight: 700 }}>{person.name}</div>

                <div style={{ marginLeft: 'auto', fontFamily: 'Syne', fontSize: 22, fontWeight: 800, color: person.color }}>

            {/* Per-card breakdown */}

                return (

                    </div>
                    <div style={{ paddingLeft: 12 }}>
                      {txs.map(t => {
                        const instMatch = t.description.match(/(\d+\/\d+)/);
                        const inst = instMatch ? instMatch[1] : null;
                        const cleanDesc = t.description.replace(/\s*\d+\/\d+\s*/g, '').trim();
                        return (
                          <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between',
                            padding: '6px 0', borderBottom: '1px solid #f1f5f9', fontSize: 13 }}>
                            <div>
                              <span>{CATEGORY_ICONS[t.category] || '📝'} {cleanDesc}</span>
                              {inst && (
                                <span style={{ marginLeft: 8, fontSize: 11, background: '#eff6ff',
                                  color: 'var(--accent)', padding: '1px 8px', borderRadius: 20,
                                  fontFamily: 'DM Mono', fontWeight: 600 }}>
                                  {inst}
                                </span>
                              )}
                            </div>
                            <span style={{ fontFamily: 'DM Mono', fontWeight: 600, color: 'var(--danger)', fontSize: 13 }}>
                              {fmt(t.amount)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Message preview */}
            {isPreviewing && (
              <div style={{ padding: '16px 24px', borderBottom: '1px solid var(--border)',
                background: '#f8fafc' }}>
                <div style={{ fontSize: 11, color: 'var(--muted)', fontFamily: 'DM Mono',
                  marginBottom: 8, textTransform: 'uppercase', letterSpacing: 1 }}>
                  📱 Preview da Mensagem
                </div>
                <pre style={{ fontFamily: 'DM Sans', fontSize: 13, lineHeight: 1.7,
                  whiteSpace: 'pre-wrap', color: 'var(--text)', margin: 0 }}>
                  {msg}
                </pre>
              </div>
            )}

            {/* Actions */}
            <div style={{ padding: '14px 24px', display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
              <button className="btn btn-ghost btn-sm"
                onClick={() => setPreview(isPreviewing ? null : person.id)}>
                {isPreviewing ? '🙈 Fechar preview' : '👁️ Ver mensagem'}
              </button>
              <button
                className="btn btn-ghost btn-sm"
                onClick={() => handleCopy(person.id, msg)}
                style={{ minWidth: 140 }}>
                {isCopied ? '✅ Copiado!' : '📋 Copiar mensagem'}
              </button>
              <button
                className="btn btn-primary btn-sm"
                onClick={() => handleWhatsApp(msg)}
                style={{ background: '#25d366', minWidth: 160 }}>
                <span>📲</span> Abrir no WhatsApp
              </button>
              <span style={{ fontSize: 12, color: 'var(--muted)', marginLeft: 'auto' }}>
                Total: <strong style={{ color: 'var(--danger)' }}>{fmt(person.total)}</strong>
              </span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ==================== APP ====================
function App() {
  const [transactions, setTransactions] = useState(()=>load('fin_transactions',[]));
  const [people, setPeople] = useState(()=>load('fin_people', DEFAULT_PEOPLE));
  const [classificationMemory, setClassificationMemory] = useState(()=>load('fin_clf_memory',{}));
  const [month, setMonth] = useState(nowMonth);
  const [view, setView] = useState('dashboard');
  const [showAdd, setShowAdd] = useState(false);
  const [defaultModule, setDefaultModule] = useState('personal');
  const [notif, setNotif] = useState(null);

  useEffect(()=>{ save('fin_transactions', transactions); }, [transactions]);
  useEffect(()=>{ save('fin_people', people); }, [people]);
  useEffect(()=>{ save('fin_clf_memory', classificationMemory); }, [classificationMemory]);

  const handleSaveMemory = (mem) => setClassificationMemory(mem);

  const handleImportTransactions = (txList) => {
    setTransactions(prev => [...prev, ...txList]);
    notify(txList.length + ' lancamentos importados da fatura!');
    setView('family');
  };

  const notify = (msg, type='success') => {
    setNotif({ msg, type, key: uid() });
    setTimeout(()=>setNotif(null), 3200);
  };

  const handleSave = (tx) => {
    setTransactions(prev=>[...prev, tx]);
    notify(`Lançamento "${tx.description}" salvo com sucesso!`);
  };

  const handleDelete = (id) => {
    if(!confirm('Excluir este lançamento?')) return;
    setTransactions(prev=>prev.filter(t=>t.id!==id));
    notify('Lançamento removido.', 'error');
  };

  const openAdd = (mod) => { setDefaultModule(mod); setShowAdd(true); };

  const monthsOpts = useMemo(()=>{
    const m = new Set(transactions.map(t=>t.month));
    m.add(nowMonth());
    return [...m].sort().reverse();
  }, [transactions]);

  const navItems = [
    { id:'dashboard', icon:'📊', label:'Dashboard' },
    { id:'family',    icon:'👨‍👩‍👧', label:'Família / Cartão' },
    { id:'personal',  icon:'👤', label:'Pessoal' },
    { id:'agency',    icon:'✈️', label:'PrimeWay Viagens' },
    { id:'reports',   icon:'📈', label:'Relatórios' },
    { id:'fatura',    icon:'📤', label:'Importar Fatura' },
    { id:'cobrar',    icon:'💬', label:'Cobrar Parentes' },
  ];

  const pageTitle = {
    dashboard: '📊 Dashboard',
    family: '👨‍👩‍👧 Gastos de Família',
    personal: '👤 Gastos Pessoais',
    agency: '✈️ PrimeWay Viagens',
    reports: '📈 Relatórios',
    fatura: '📤 Importar Fatura PDF',
    cobrar: '💬 Cobrar Parentes',
  };

  const addLabel = {
    family: '+ Gasto Família',
    personal: '+ Gasto Pessoal',
    agency: '+ Lançamento Agência',
    dashboard: '+ Novo Lançamento',
    reports: null,
    fatura: null,
    cobrar: null,
  };

  const addMod = { family:'family', personal:'personal', agency:'agency', dashboard:'personal' };

  return (
    <div className="app">
      {/* SIDEBAR */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-title">FinControl Pro</div>
          <div className="logo-sub">controle financeiro</div>
        </div>
        <nav className="sidebar-nav">
          <span className="nav-section-label">Módulos</span>
          {navItems.map(n=>(
            <button key={n.id} className={`nav-item ${view===n.id?'active':''}`} onClick={()=>setView(n.id)}>
              <span className="nav-icon">{n.icon}</span>
              {n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="month-selector">
            <span style={{fontSize:14}}>📅</span>
            <select value={month} onChange={e=>setMonth(e.target.value)}>
              {monthsOpts.map(m=><option key={m} value={m}>{fmtMonth(m)}</option>)}
            </select>
          </div>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main">
        <div className="topbar">
          <span className="topbar-title">{pageTitle[view]}</span>
          <div className="topbar-actions">
            {addLabel[view] && (
              <button className="btn btn-primary" onClick={()=>openAdd(addMod[view]||'personal')}>
                {addLabel[view]}
              </button>
            )}
          </div>
        </div>

        {view==='dashboard' && <Dashboard transactions={transactions} people={people} month={month} />}
        {view==='family'    && <FamilyModule transactions={transactions} people={people} onDelete={handleDelete} month={month} onManagePeople={setPeople} />}
        {view==='personal'  && <PersonalModule transactions={transactions} people={people} onDelete={handleDelete} month={month} />}
        {view==='agency'    && <AgencyModule transactions={transactions} people={people} onDelete={handleDelete} month={month} />}
        {view==='reports'   && <Reports transactions={transactions} people={people} month={month} />}
        {view==='fatura'    && <FaturaImport people={people} onImportTransactions={handleImportTransactions} classificationMemory={classificationMemory} onSaveMemory={handleSaveMemory} />}
        {view==='cobrar'    && <CobrarModule transactions={transactions} people={people} month={month} />}
      </main>

      {/* MODAL */}
      {showAdd && (
        <AddTransactionModal
          onClose={()=>setShowAdd(false)}
          onSave={handleSave}
          people={people}
          defaultModule={defaultModule}
        />
      )}

      {/* NOTIF */}
      {notif && <Notif key={notif.key} msg={notif.msg} type={notif.type} onDone={()=>setNotif(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
